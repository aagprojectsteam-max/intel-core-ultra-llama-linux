# Copy desired settings to your user-owned config.conf. This file is shell code.
# Environment overrides: AAG_LLAMA_MODEL_ROOT, AAG_LLAMA_ROOT,
# AAG_LLAMA_BUILD_DIR, AAG_LLAMA_ONEAPI_ENV, AAG_LLAMA_FAST_TEXT_MODEL,
# AAG_LLAMA_HOST, AAG_LLAMA_PORT, AAG_LLAMA_CONFIG.
LLAMA_ROOT="$HOME/llama.cpp"
BUILD_DIR="$LLAMA_ROOT/build-sycl"
MODEL_ROOT="$HOME/Models"
ONEAPI_ENV="/opt/intel/oneapi/setvars.sh"
HOST="127.0.0.1"
PORT="8080"
FLASH_ATTN="on"

# Optional explicit model mapping; no model is downloaded or selected for you.
FAST_TEXT_TARGET=""
FAST_TEXT_MTP=""
FAST_TEXT_MTP3=0

# Optional --mtp auto approval. All four values and metadata must agree.
APPROVED_MTP_TARGET=""
APPROVED_MTP_TARGET_SHA256=""
APPROVED_MTP_DRAFT=""
APPROVED_MTP_DRAFT_SHA256=""
